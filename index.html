<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бюджет месяца</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: одна колонка-«кошелёк»: сводка сверху, группы конвертов ниже, нижняя шторка для списания */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --ink: #17221e;
  --muted: #64716b;
  --line: #d9e0dc;
  --accent: #0f6b55;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;
  --warn: #b46a00;
  --warn-soft: #f6e8cf;
  --bad: #b3261e;
  --bad-soft: #f6dcd9;
  --track: #e3e8e5;
  --scrim: rgba(10, 20, 16, .42);
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #18201d; --ink: #e6ede9; --muted: #93a19a; --line: #29332f;
    --accent: #4fc29f; --accent-ink: #06231a; --accent-soft: #1d3a31;
    --warn: #f0b04c; --warn-soft: #3a2d15; --bad: #ff8a80; --bad-soft: #3d1d1b;
    --track: #25302c; --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #18201d; --ink: #e6ede9; --muted: #93a19a; --line: #29332f;
  --accent: #4fc29f; --accent-ink: #06231a; --accent-soft: #1d3a31;
  --warn: #f0b04c; --warn-soft: #3a2d15; --bad: #ff8a80; --bad-soft: #3d1d1b;
  --track: #25302c; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* Сводка */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.month {
  font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em;
  background: none; border: 0; padding: 4px 0; text-align: left; min-width: 0;
}
.month small { display: block; font: 600 11px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ghost {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.summary {
  background: var(--accent); color: var(--accent-ink); border-radius: 22px;
  padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px;
}
.summary .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.summary .big { font-size: clamp(30px, 9vw, 40px); font-weight: 700; line-height: 1.05; overflow-wrap: anywhere; }
.summary .big span { font-family: var(--font-body); font-size: 15px; font-weight: 600; opacity: .8; margin-left: 6px; letter-spacing: 0; }
.summary .bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent-ink) 22%, transparent); overflow: hidden; }
.summary .bar i { display: block; height: 100%; background: var(--accent-ink); border-radius: 99px; transition: width .3s; }
.summary .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.summary .row b { display: block; font-size: 15px; }
.summary .row div:last-child { text-align: right; }

/* Группы */
.group { display: flex; flex-direction: column; gap: 8px; }
.ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.ghead h2 { margin: 0; font: 600 12px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ghead .num { font-size: 12px; color: var(--muted); }
.list { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); overflow: hidden; }
.cat {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line);
  padding: 13px 16px 14px;
}
.cat:first-child { border-top: 0; }
.cat:active { background: var(--accent-soft); }
.cat .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.cat .left { font-weight: 700; font-size: 15px; text-align: right; }
.cat .meta { font-size: 12px; color: var(--muted); }
.cat .of { font-size: 12px; color: var(--muted); text-align: right; }
.cat .track { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 4px; }
.cat .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.cat.low .left { color: var(--warn); } .cat.low .track i { background: var(--warn); }
.cat.over .left { color: var(--bad); } .cat.over .track i { background: var(--bad); }
.cat.done .name, .cat.done .left { color: var(--muted); }
.cat.done .track i { background: var(--muted); }
.pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
.pill.over { background: var(--bad-soft); color: var(--bad); }
.pill.done { background: var(--track); color: var(--muted); }
.addcat { width: 100%; background: none; border: 0; border-top: 1px dashed var(--line); padding: 12px 16px; text-align: left; color: var(--accent); font-weight: 600; font-size: 14px; }

/* История */
.hist { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); }
.op { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
.op:first-child { border-top: 0; }
.op .what { min-width: 0; }
.op .what b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.op .what small { color: var(--muted); font-size: 12px; }
.op .amt { font-weight: 700; }
.op .amt.plus { color: var(--accent); }
.op button { border: 0; background: var(--track); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* Шторка */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  max-height: 92vh; overflow-y: auto;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .summary .bar i, .cat .track i { transition: none; } }
.sheet-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 4px; border-radius: 9px; background: var(--line); margin: 0 auto 4px; }
.sh-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sh-title h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 18px; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.sh-title p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.x { border: 0; background: var(--track); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 1; flex: none; color: var(--muted); }
.amount {
  display: flex; align-items: baseline; gap: 8px; border: 2px solid var(--accent); border-radius: 16px; padding: 10px 14px;
}
.amount input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; font-family: var(--font-num); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
.amount span { color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 7px 12px; font-family: var(--font-num); font-size: 13px; font-weight: 500; }
.note { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); width: 100%; }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 15px; }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: var(--bg); color: var(--ink); font-size: 16px; font-weight: 500; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; align-self: center; }
.mini h4 { margin: 4px 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mini .op { padding-inline: 0; }
.sync { margin: -12px 4px 0; font-size: 12px; color: var(--muted); }
.ro .foot { display: none; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 12px 10px 16px;
  display: flex; gap: 14px; align-items: center; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px);
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
}
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; padding: 4px 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="month" id="monthBtn" type="button"><small>Расходы</small><span id="monthName">Ноябрь</span></button>
    <button class="ghost" id="themeBtn" type="button" aria-label="Сменить тему">Тема</button>
  </header>

  <section class="summary" aria-live="polite">
    <div>
      <div class="label">Осталось на месяц</div>
      <div class="big num" id="sumLeft">0</div>
    </div>
    <div class="bar"><i id="sumBar" style="width:0"></i></div>
    <div class="row">
      <div>Потрачено<b class="num" id="sumSpent">0</b></div>
      <div>Бюджет<b class="num" id="sumBudget">0</b></div>
    </div>
  </section>
  <p class="sync" id="syncNote">Загружаю…</p>

  <div id="groups" class="wrap" style="gap:22px"></div>

  <section class="group">
    <div class="ghead"><h2>Последние списания</h2></div>
    <div class="hist" id="hist"></div>
  </section>

  <div class="foot">
    <button class="ghost" id="addGroupBtn" type="button">+ Новая группа</button>
    <button class="ghost" id="newMonthBtn" type="button">Начать новый месяц</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="toastUndo">Отменить</button></div>

<script>
(function () {
  const KEY = "rashody-v1";
  const CUR = "сум";
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // Стартовый список — только для локального режима (файл открыт вне Claude).
  const seed = () => ({
    month: "Ноябрь", period: uid(),
    groups: [
      { name: "Обязательные", cats: [
        ["Вода", 250000], ["Массаж Алихан", 1000000], ["Ногти и т. д.", 900000], ["Укол Седжаро", 1150000],
        ["Дерматолог, анализы, таблетки", 2000000], ["Еда Алихана", 1160000], ["Памперс", 1160000],
        ["Удаление зуба мудрости", 850000], ["ИИ", 2300000], ["Вернуть Назиме", 2068000],
        ["Волосы Асыла", 250000], ["Такси", 3200000]
      ]},
      { name: "Коммуналка", cats: [
        ["Свет", 200000], ["Вода", 200000], ["Wi‑Fi", 180000], ["Телефоны", 150000], ["Отопление", 250000]
      ]},
      { name: "Дополнительно", cats: [
        ["Кроссовки, косметика, утягивающее", 2000000], ["Настроение Назимы (цветы, подарки)", 1000000],
        ["Рестораны", 1000000], ["Экстренные случаи (врачи)", 2000000], ["Одежда Асыла и Алихана", 2000000]
      ]},
      { name: "Еда и дом", cats: [["Еда", 7000000], ["Ковёр", 1000000]] }
    ].map(g => ({ id: uid(), name: g.name, cats: g.cats.map(([name, budget]) => ({ id: uid(), name, budget })) }))
  });

  const $ = id => document.getElementById(id);
  const fmt = n => { const s = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); return (n < 0 ? "−" : "") + s; };
  const parse = s => parseInt(String(s).replace(/\D/g, ""), 10) || 0;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const when = ts => { const d = new Date(ts); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };

  // ---------- Хранилище: общее (db) или локальное ----------
  let S = null;        // { month, period, groups }
  let ALL_OPS = [];    // все списания; текущий месяц — с тем же period
  let mode = "loading";
  let readOnly = false;
  let db = null;

  const ops = () => ALL_OPS.filter(o => o.period === S.period).sort((a, b) => a.ts - b.ts);

  const local = {
    load() {
      let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
      if (!d || !d.cfg) d = { cfg: seed(), ops: [] };
      S = d.cfg; ALL_OPS = d.ops;
    },
    save() { try { localStorage.setItem(KEY, JSON.stringify({ cfg: S, ops: ALL_OPS })); } catch (e) {} }
  };

  let cfgChain = Promise.resolve();
  function failed(e) {
    if (e && e.code === "invalid_argument") { readOnly = true; render(); toast("У тебя доступ только на просмотр"); }
    else if (e && e.code === "quota_exceeded") toast("Хранилище заполнено. Начни новый месяц, чтобы освободить место");
    else toast("Не получилось сохранить. Проверь интернет и попробуй ещё раз");
  }
  function saveCfg() {
    if (mode === "local") return local.save();
    const body = JSON.parse(JSON.stringify(S));
    cfgChain = cfgChain.then(() => db.doc("budget/main").set(body)).catch(failed);
  }
  function addOp(op) {
    ALL_OPS.push(op);
    if (mode === "local") return local.save();
    db.collection("ops").doc(op.id).set(op).catch(e => { ALL_OPS = ALL_OPS.filter(o => o.id !== op.id); render(); failed(e); });
  }
  function removeOp(id) {
    ALL_OPS = ALL_OPS.filter(o => o.id !== id);
    if (mode === "local") return local.save();
    db.collection("ops").doc(id).delete().catch(failed);
  }

  async function boot() {
    let got = null;
    try { if (window.claude && window.claude.use) got = await window.claude.use("db"); } catch (e) { got = null; }
    if (!got) { mode = "local"; local.load(); render(); return; }
    db = got; mode = "shared";
    try {
      const user = await window.claude.use("user");
      if (user && user.can && user.can("data.write") === false) readOnly = true;
    } catch (e) {}
    db.doc("budget/main").onSnapshot(snap => {
      S = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      render();
    }, () => { mode = "error"; render(); });
    db.collection("ops").onSnapshot(snap => {
      ALL_OPS = snap.docs.map(d => d.data());
      render();
    }, () => {});
  }

  // ---------- Отрисовка ----------
  const spentOf = id => ops().reduce((a, o) => o.catId === id ? a + o.amount : a, 0);
  const findCat = id => { for (const g of S.groups) for (const c of g.cats) if (c.id === id) return { g, c }; return null; };

  function render() {
    const note = $("syncNote");
    note.textContent = mode === "shared" ? (readOnly ? "Общий бюджет · только просмотр" : "Общий бюджет · изменения видны всем, у кого есть ссылка")
      : mode === "local" ? "Сохраняется только в этом браузере" : mode === "error" ? "Нет связи с хранилищем" : "Загружаю…";
    document.body.classList.toggle("ro", readOnly);

    if (!S) {
      $("monthName").textContent = "Расходы";
      $("sumLeft").innerHTML = "0<span>" + CUR + "</span>"; $("sumSpent").textContent = "0"; $("sumBudget").textContent = "0"; $("sumBar").style.width = "0";
      $("groups").innerHTML = mode === "loading" ? "" :
        `<div class="list"><div class="empty">Бюджет пока пустой. Создай первую группу, например «Обязательные», и добавь в неё расходы с суммами на месяц.</div>
         ${readOnly ? "" : '<button class="addcat" type="button" id="firstGroup">+ Создать группу</button>'}</div>`;
      $("hist").innerHTML = '<div class="empty">Списаний пока нет.</div>';
      if ($("firstGroup")) $("firstGroup").onclick = () => $("addGroupBtn").click();
      return;
    }

    $("monthName").textContent = S.month;
    let tb = 0, ts = 0;
    $("groups").innerHTML = S.groups.map(g => {
      let gb = 0, gs = 0;
      const rows = g.cats.map(c => {
        const sp = spentOf(c.id), left = c.budget - sp;
        gb += c.budget; gs += sp;
        const pct = c.budget ? Math.min(100, Math.max(0, sp / c.budget * 100)) : (sp > 0 ? 100 : 0);
        const cls = left < 0 ? "over" : (c.budget > 0 && left === 0) ? "done" : (c.budget > 0 && left / c.budget <= .2 && sp > 0) ? "low" : "";
        const pill = left < 0 ? '<span class="pill over">перерасход</span>' : cls === "done" ? '<span class="pill done">закрыто</span>' : "";
        return `<button class="cat ${cls}" type="button" data-cat="${c.id}">
          <span class="name">${esc(c.name)}${pill}</span><span class="left num">${fmt(left)}</span>
          <span class="meta">${sp ? "потрачено " + fmt(sp) : "ещё не тратили"}</span><span class="of num">из ${fmt(c.budget)}</span>
          <span class="track"><i style="width:${pct}%"></i></span></button>`;
      }).join("");
      tb += gb; ts += gs;
      return `<section class="group"><div class="ghead"><h2>${esc(g.name)}</h2><span class="num">${fmt(gb - gs)} из ${fmt(gb)}</span></div>
        <div class="list">${rows}${readOnly ? "" : `<button class="addcat" type="button" data-addcat="${g.id}">+ Добавить расход</button>`}</div></section>`;
    }).join("");
    $("sumLeft").innerHTML = fmt(tb - ts) + `<span>${CUR}</span>`;
    $("sumSpent").textContent = fmt(ts);
    $("sumBudget").textContent = fmt(tb);
    $("sumBar").style.width = (tb ? Math.max(0, Math.min(100, (tb - ts) / tb * 100)) : 0) + "%";

    const recent = ops().slice(-15).reverse();
    $("hist").innerHTML = recent.length ? recent.map(opRow).join("") :
      '<div class="empty">Пока пусто. Нажми на любой расход выше и впиши, сколько потратили.</div>';
  }

  function opRow(o) {
    const f = findCat(o.catId);
    const name = f ? f.c.name : "Удалённый расход";
    return `<div class="op"><div class="what"><b>${esc(o.note || name)}</b><small>${o.note ? esc(name) + " · " : ""}${when(o.ts)}</small></div>
      <span class="amt num ${o.amount < 0 ? "plus" : ""}">${o.amount < 0 ? "+" + fmt(-o.amount) : "−" + fmt(o.amount)}</span>
      ${readOnly ? "<span></span>" : `<button type="button" data-undo="${o.id}">Отменить</button>`}</div>`;
  }

  // ---------- Шторка ----------
  function openSheet(html) { $("sheetIn").innerHTML = '<div class="grab"></div>' + html; $("sheet").hidden = false; $("scrim").hidden = false; }
  function closeSheet() { $("sheet").hidden = true; $("scrim").hidden = true; }
  $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  function bindAmount(input) {
    input.addEventListener("input", () => { const v = parse(input.value); input.value = v ? fmt(v) : ""; });
  }

  function openSpend(catId) {
    const f = findCat(catId); if (!f) return;
    const c = f.c, sp = spentOf(c.id), left = c.budget - sp;
    const mine = ops().filter(o => o.catId === c.id).slice(-6).reverse();
    if (readOnly) {
      openSheet(`<div class="sh-title"><div><h3>${esc(c.name)}</h3><p>Осталось <b class="num">${fmt(left)}</b> из <span class="num">${fmt(c.budget)}</span> ${CUR}</p></div>
        <button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
        ${mine.length ? `<div class="mini"><h4>История</h4>${mine.map(opRow).join("")}</div>` : '<p class="empty" style="padding:0">Списаний пока нет.</p>'}`);
      return;
    }
    openSheet(`
      <div class="sh-title"><div><h3>${esc(c.name)}</h3><p>Осталось <b class="num">${fmt(left)}</b> из <span class="num">${fmt(c.budget)}</span> ${CUR}</p></div>
        <button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
      <label class="amount" for="amt"><input id="amt" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Сумма в сумах"><span>${CUR}</span></label>
      <div class="chips">${[50000, 100000, 200000, 500000, 1000000].map(v => `<button type="button" data-chip="${v}">+${fmt(v)}</button>`).join("")}
        ${left > 0 ? `<button type="button" data-chip="all">весь остаток</button>` : ""}</div>
      <input class="note" id="note" placeholder="Комментарий (необязательно)" autocomplete="off">
      <div class="actions"><button class="btn sec" type="button" id="refund" disabled>Вернуть</button><button class="btn main" type="button" id="spend" disabled>Списать</button></div>
      ${mine.length ? `<div class="mini"><h4>История</h4>${mine.map(opRow).join("")}</div>` : ""}
      <button class="linkbtn" type="button" id="editCat">Изменить название или бюджет</button>`);
    const amt = $("amt"); bindAmount(amt);
    const sync = () => { const ok = parse(amt.value) > 0; $("spend").disabled = !ok; $("refund").disabled = !ok; };
    amt.addEventListener("input", sync);
    $("sheetIn").querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
      const v = b.dataset.chip === "all" ? left : parse(amt.value) + +b.dataset.chip;
      amt.value = fmt(v); sync();
    });
    const go = sign => {
      const v = parse(amt.value); if (!v) return;
      const op = { id: uid(), catId: c.id, amount: sign * v, ts: Date.now(), note: $("note").value.trim(), period: S.period };
      addOp(op); render(); closeSheet();
      toast(`${sign > 0 ? "Списано" : "Возвращено"} ${fmt(v)} · ${c.name}`, op.id);
    };
    $("spend").onclick = () => go(1);
    $("refund").onclick = () => go(-1);
    amt.addEventListener("keydown", e => { if (e.key === "Enter") go(1); });
    $("editCat").onclick = () => openEdit(c.id);
    setTimeout(() => amt.focus(), 60);
  }

  function openEdit(catId, groupId) {
    const f = catId ? findCat(catId) : null;
    const c = f ? f.c : { name: "", budget: 0 };
    openSheet(`
      <div class="sh-title"><div><h3>${f ? "Изменить расход" : "Новый расход"}</h3></div><button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
      <label class="field" for="eName">Название<input id="eName" value="${esc(c.name)}" autocomplete="off" placeholder="Например, бензин"></label>
      <label class="field" for="eBudget">Бюджет на месяц, ${CUR}<input id="eBudget" inputmode="numeric" value="${c.budget ? fmt(c.budget) : ""}" placeholder="0" autocomplete="off"></label>
      <div class="actions">${f ? `<button class="btn danger" type="button" id="eDel">Удалить</button>` : `<button class="btn sec" type="button" data-close>Отмена</button>`}
        <button class="btn main" type="button" id="eSave">Сохранить</button></div>
      <p id="eConfirm" class="empty" hidden style="padding:0">Нажми «Удалить» ещё раз: расход исчезнет из списка.</p>`);
    bindAmount($("eBudget"));
    $("eSave").onclick = () => {
      const name = $("eName").value.trim(); if (!name) { $("eName").focus(); return; }
      const budget = parse($("eBudget").value);
      if (f) { f.c.name = name; f.c.budget = budget; }
      else S.groups.find(g => g.id === groupId).cats.push({ id: uid(), name, budget });
      saveCfg(); render(); closeSheet();
    };
    if (f) {
      let armed = false;
      $("eDel").onclick = () => {
        if (!armed) { armed = true; $("eConfirm").hidden = false; return; }
        f.g.cats = f.g.cats.filter(x => x.id !== f.c.id);
        saveCfg(); render(); closeSheet();
      };
    }
    setTimeout(() => $("eName").focus(), 60);
  }

  function openText(title, label, value, onSave, extra) {
    openSheet(`
      <div class="sh-title"><div><h3>${title}</h3></div><button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
      <label class="field" for="tVal">${label}<input id="tVal" value="${esc(value)}" autocomplete="off"></label>
      ${extra || ""}
      <div class="actions"><button class="btn sec" type="button" data-close>Отмена</button><button class="btn main" type="button" id="tSave">Сохранить</button></div>`);
    $("tSave").onclick = () => { const v = $("tVal").value.trim(); if (!v) return; onSave(v); saveCfg(); render(); closeSheet(); };
    setTimeout(() => $("tVal").focus(), 60);
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-cat],[data-addcat],[data-undo],[data-close]");
    if (!t) return;
    if (t.dataset.close !== undefined) return closeSheet();
    if (t.dataset.cat) return openSpend(t.dataset.cat);
    if (t.dataset.addcat) return openEdit(null, t.dataset.addcat);
    if (t.dataset.undo) {
      const op = ALL_OPS.find(o => o.id === t.dataset.undo);
      removeOp(t.dataset.undo); render();
      if (!$("sheet").hidden && op) openSpend(op.catId);
    }
  });

  const editable = () => !readOnly && mode !== "loading" && mode !== "error";
  $("monthBtn").onclick = () => { if (editable() && S) openText("Месяц", "Название", S.month, v => S.month = v); };
  $("addGroupBtn").onclick = () => {
    if (!editable()) return;
    openText("Новая группа", "Название группы", "", v => {
      if (!S) S = { month: new Date().toLocaleDateString("ru-RU", { month: "long" }).replace(/^./, m => m.toUpperCase()), period: uid(), groups: [] };
      S.groups.push({ id: uid(), name: v, cats: [] });
    });
  };
  $("newMonthBtn").onclick = () => {
    if (!editable() || !S) return;
    openText("Новый месяц", "Название месяца", "",
      v => { S.month = v; S.period = uid(); },
      '<p class="empty" style="padding:0">Бюджеты останутся, а остатки снова станут полными. Списания прошлого месяца больше не будут показаны.</p>');
  };

  // Тост с отменой
  let tTimer, tOp;
  function toast(text, opId) {
    $("toastText").textContent = text; tOp = opId; $("toastUndo").hidden = !opId; $("toast").hidden = false;
    clearTimeout(tTimer); tTimer = setTimeout(() => $("toast").hidden = true, 4000);
  }
  $("toastUndo").onclick = () => { if (tOp) { removeOp(tOp); render(); } $("toast").hidden = true; };

  // Тема
  const themes = ["system", "light", "dark"];
  let theme; try { theme = localStorage.getItem(KEY + "-theme") || "system"; } catch (e) { theme = "system"; }
  const applyTheme = () => {
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    $("themeBtn").textContent = { system: "Тема: авто", light: "Тема: светлая", dark: "Тема: тёмная" }[theme];
  };
  $("themeBtn").onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; try { localStorage.setItem(KEY + "-theme", theme); } catch (e) {} applyTheme(); };
  applyTheme();

  render();
  boot();
})();
</script>
</body>
</html>
