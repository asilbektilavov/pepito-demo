<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бюджет месяца</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: одна спокойная колонка: остаток сверху, ниже простые списки «название — остаток» */
:root {
  --bg: #f4f5f3;
  --surface: #ffffff;
  --ink: #1d211f;
  --muted: #7a817d;
  --line: #ebedeb;
  --accent: #2f7a63;
  --accent-ink: #ffffff;
  --accent-soft: #e6f0ec;
  --warn: #b7791f;
  --bad: #c0392b;
  --scrim: rgba(20, 24, 22, .35);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121413; --surface: #1c1f1d; --ink: #e9ece9; --muted: #8d958f; --line: #2a2e2b;
    --accent: #5bb894; --accent-ink: #0d1f18; --accent-soft: #1f3129;
    --warn: #e0a84a; --bad: #f07a6c; --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121413; --surface: #1c1f1d; --ink: #e9ece9; --muted: #8d958f; --line: #2a2e2b;
  --accent: #5bb894; --accent-ink: #0d1f18; --accent-soft: #1f3129;
  --warn: #e0a84a; --bad: #f07a6c; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.4 var(--font);
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

/* Шапка с остатком */
.head { display: flex; flex-direction: column; gap: 6px; padding: 0 4px; }
.month { background: none; border: 0; padding: 0; text-align: left; font-size: 17px; font-weight: 600; color: var(--muted); align-self: flex-start; }
.left-total { font-size: 42px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; overflow-wrap: anywhere; }
.left-total small { font-size: 20px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.of-total { color: var(--muted); font-size: 16px; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.status { font-size: 14px; color: var(--muted); }

/* Группы */
.group { display: flex; flex-direction: column; gap: 10px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 4px; }
.ghead h2 { margin: 0; font-size: 20px; font-weight: 700; }
.ghead span { color: var(--muted); font-size: 15px; white-space: nowrap; }
.list { background: var(--surface); border-radius: 16px; overflow: hidden; }
.cat {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  width: 100%; min-height: 60px; padding: 14px 18px;
  background: none; border: 0; border-top: 1px solid var(--line); text-align: left;
}
.cat:first-child { border-top: 0; }
.cat:active { background: var(--accent-soft); }
.cat .name { min-width: 0; overflow-wrap: anywhere; }
.cat .sum { font-weight: 600; white-space: nowrap; }
.cat.low .sum { color: var(--warn); }
.cat.over .sum { color: var(--bad); }
.cat.done .name, .cat.done .sum { color: var(--muted); }
.add { width: 100%; min-height: 54px; padding: 14px 18px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; color: var(--accent); font-weight: 600; }

/* История */
.op { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 10px 10px 18px; border-top: 1px solid var(--line); }
.op:first-child { border-top: 0; }
.op .what { flex: 1; min-width: 0; }
.op .what div { overflow-wrap: anywhere; }
.op .what small { color: var(--muted); font-size: 14px; }
.op .amt { font-weight: 600; white-space: nowrap; }
.op .amt.plus { color: var(--accent); }
.op .undo { border: 0; background: none; color: var(--muted); width: 44px; height: 44px; border-radius: 50%; font-size: 22px; line-height: 1; flex: none; }
.empty { padding: 18px; color: var(--muted); font-size: 16px; }

.foot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.textbtn { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 12px; }
.ro .foot, .ro .add { display: none; }

/* Шторка */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 24px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  max-height: 90vh; overflow-y: auto;
  animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(30px); } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .bar i { transition: none; } }
.sheet-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.sh-title h3 { margin: 0; font-size: 22px; font-weight: 700; overflow-wrap: anywhere; }
.sh-title p { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
.amount { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--accent); padding: 4px 2px 8px; }
.amount input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
.amount span { color: var(--muted); font-size: 18px; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chips button { border: 0; background: var(--bg); border-radius: 12px; min-height: 48px; font-size: 16px; font-weight: 600; }
.btn { width: 100%; border: 0; border-radius: 14px; min-height: 56px; font-size: 18px; font-weight: 700; }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: none; color: var(--bad); font-weight: 600; min-height: 48px; }
.btn:disabled { opacity: .4; cursor: default; }
.links { display: flex; justify-content: space-between; gap: 12px; }
.links button { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 10px 2px; }
.field { display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--muted); }
.field input { border: 0; border-radius: 12px; padding: 14px; background: var(--bg); color: var(--ink); font-size: 18px; }
.hint { margin: 0; color: var(--muted); font-size: 15px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 18px;
  display: flex; gap: 10px; align-items: center; font-size: 16px; width: max-content; max-width: calc(100% - 32px);
}
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; padding: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <button class="month" id="monthBtn" type="button">Ноябрь</button>
    <div class="left-total" id="sumLeft">0</div>
    <div class="of-total" id="sumOf"></div>
    <div class="bar"><i id="sumBar" style="width:0"></i></div>
    <div class="status" id="syncNote" hidden></div>
  </header>

  <div id="groups" class="wrap"></div>

  <section class="group" id="histBox">
    <div class="ghead"><h2>Последние траты</h2></div>
    <div class="list" id="hist"></div>
  </section>

  <div class="foot">
    <button class="textbtn" id="addGroupBtn" type="button">+ Новая группа</button>
    <button class="textbtn" id="newMonthBtn" type="button">Начать новый месяц</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden><span id="toastText"></span><button type="button" id="toastUndo">Отменить</button></div>

<script>
(function () {
  const KEY = "rashody-v1";
  const CUR = "сум";
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // Стартовый список — только для локального режима (файл открыт вне Claude).
  const seed = () => ({
    month: "Ноябрь", period: uid(),
    groups: [
      { name: "Обязательные", cats: [
        ["Вода", 250000], ["Массаж Алихан", 1000000], ["Ногти и т. д.", 900000], ["Укол Седжаро", 1150000],
        ["Дерматолог, анализы, таблетки", 2000000], ["Еда Алихана", 1160000], ["Памперс", 1160000],
        ["Удаление зуба мудрости", 850000], ["ИИ", 2300000], ["Вернуть Назиме", 2068000],
        ["Волосы Асыла", 250000], ["Такси", 3200000]
      ]},
      { name: "Коммуналка", cats: [
        ["Свет", 200000], ["Вода", 200000], ["Wi‑Fi", 180000], ["Телефоны", 150000], ["Отопление", 250000]
      ]},
      { name: "Дополнительно", cats: [
        ["Кроссовки, косметика, утягивающее", 2000000], ["Настроение Назимы (цветы, подарки)", 1000000],
        ["Рестораны", 1000000], ["Экстренные случаи (врачи)", 2000000], ["Одежда Асыла и Алихана", 2000000]
      ]},
      { name: "Еда и дом", cats: [["Еда", 7000000], ["Ковёр", 1000000]] }
    ].map(g => ({ id: uid(), name: g.name, cats: g.cats.map(([name, budget]) => ({ id: uid(), name, budget })) }))
  });

  const $ = id => document.getElementById(id);
  const fmt = n => { const s = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); return (n < 0 ? "−" : "") + s; };
  const parse = s => parseInt(String(s).replace(/\D/g, ""), 10) || 0;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const when = ts => { const d = new Date(ts); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };

  // ---------- Хранилище: общее (db) или локальное ----------
  let S = null;        // { month, period, groups }
  let ALL_OPS = [];    // все списания; текущий месяц — с тем же period
  let mode = "loading";
  let readOnly = false;
  let db = null;

  const ops = () => ALL_OPS.filter(o => o.period === S.period).sort((a, b) => a.ts - b.ts);

  const local = {
    load() {
      let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
      if (!d || !d.cfg) d = { cfg: seed(), ops: [] };
      S = d.cfg; ALL_OPS = d.ops;
    },
    save() { try { localStorage.setItem(KEY, JSON.stringify({ cfg: S, ops: ALL_OPS })); } catch (e) {} }
  };

  let cfgChain = Promise.resolve();
  function failed(e) {
    if (e && e.code === "invalid_argument") { readOnly = true; render(); toast("У тебя доступ только на просмотр"); }
    else if (e && e.code === "quota_exceeded") toast("Хранилище заполнено. Начни новый месяц, чтобы освободить место");
    else toast("Не получилось сохранить. Проверь интернет и попробуй ещё раз");
  }
  function saveCfg() {
    if (mode === "local") return local.save();
    const body = JSON.parse(JSON.stringify(S));
    cfgChain = cfgChain.then(() => db.doc("budget/main").set(body)).catch(failed);
  }
  function addOp(op) {
    ALL_OPS.push(op);
    if (mode === "local") return local.save();
    db.collection("ops").doc(op.id).set(op).catch(e => { ALL_OPS = ALL_OPS.filter(o => o.id !== op.id); render(); failed(e); });
  }
  function removeOp(id) {
    ALL_OPS = ALL_OPS.filter(o => o.id !== id);
    if (mode === "local") return local.save();
    db.collection("ops").doc(id).delete().catch(failed);
  }

  async function boot() {
    let got = null;
    try { if (window.claude && window.claude.use) got = await window.claude.use("db"); } catch (e) { got = null; }
    if (!got) { mode = "local"; local.load(); render(); return; }
    db = got; mode = "shared";
    try {
      const user = await window.claude.use("user");
      if (user && user.can && user.can("data.write") === false) readOnly = true;
    } catch (e) {}
    db.doc("budget/main").onSnapshot(snap => {
      S = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      render();
    }, () => { mode = "error"; render(); });
    db.collection("ops").onSnapshot(snap => {
      ALL_OPS = snap.docs.map(d => d.data());
      render();
    }, () => {});
  }

  // ---------- Отрисовка ----------
  const spentOf = id => ops().reduce((a, o) => o.catId === id ? a + o.amount : a, 0);
  const findCat = id => { for (const g of S.groups) for (const c of g.cats) if (c.id === id) return { g, c }; return null; };

  function render() {
    const note = mode === "local" ? "Сохраняется только в этом браузере" : mode === "error" ? "Нет связи с хранилищем" : readOnly ? "Только просмотр" : "";
    $("syncNote").textContent = note; $("syncNote").hidden = !note;
    document.body.classList.toggle("ro", readOnly);

    if (!S) {
      $("monthBtn").textContent = mode === "loading" ? "Загружаю…" : "Расходы";
      $("sumLeft").innerHTML = `0<small>${CUR}</small>`; $("sumOf").textContent = ""; $("sumBar").style.width = "0";
      $("groups").innerHTML = mode === "loading" ? "" :
        `<div class="list"><div class="empty">Бюджет пока пустой. Создай первую группу и добавь в неё расходы.</div>
         ${readOnly ? "" : '<button class="add" type="button" id="firstGroup">+ Создать группу</button>'}</div>`;
      $("histBox").hidden = true;
      if ($("firstGroup")) $("firstGroup").onclick = () => $("addGroupBtn").click();
      return;
    }

    $("monthBtn").textContent = S.month;
    let tb = 0, ts = 0;
    $("groups").innerHTML = S.groups.map(g => {
      let gb = 0, gs = 0;
      const rows = g.cats.map(c => {
        const sp = spentOf(c.id), left = c.budget - sp;
        gb += c.budget; gs += sp;
        const cls = left < 0 ? "over" : (c.budget > 0 && left === 0) ? "done" : (c.budget > 0 && sp > 0 && left / c.budget <= .2) ? "low" : "";
        return `<button class="cat ${cls}" type="button" data-cat="${c.id}"><span class="name">${esc(c.name)}</span><span class="sum">${fmt(left)}</span></button>`;
      }).join("");
      tb += gb; ts += gs;
      return `<section class="group"><div class="ghead"><h2>${esc(g.name)}</h2><span>${fmt(gb - gs)}</span></div>
        <div class="list">${rows}<button class="add" type="button" data-addcat="${g.id}">+ Добавить</button></div></section>`;
    }).join("");
    $("sumLeft").innerHTML = `${fmt(tb - ts)}<small>${CUR}</small>`;
    $("sumOf").textContent = `осталось из ${fmt(tb)}`;
    $("sumBar").style.width = (tb ? Math.max(0, Math.min(100, (tb - ts) / tb * 100)) : 0) + "%";

    const recent = ops().slice(-5).reverse();
    $("histBox").hidden = !recent.length;
    $("hist").innerHTML = recent.map(opRow).join("");
  }

  function opRow(o) {
    const f = findCat(o.catId);
    const name = o.note || (f ? f.c.name : "Удалённый расход");
    return `<div class="op"><div class="what"><div>${esc(name)}</div><small>${when(o.ts)}</small></div>
      <span class="amt ${o.amount < 0 ? "plus" : ""}">${o.amount < 0 ? "+" + fmt(-o.amount) : "−" + fmt(o.amount)}</span>
      ${readOnly ? "" : `<button class="undo" type="button" data-undo="${o.id}" aria-label="Отменить трату">×</button>`}</div>`;
  }

  // ---------- Шторка ----------
  function openSheet(html) { $("sheetIn").innerHTML = html; $("sheet").hidden = false; $("scrim").hidden = false; }
  function closeSheet() { $("sheet").hidden = true; $("scrim").hidden = true; }
  $("scrim").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  function bindAmount(input) {
    input.addEventListener("input", () => { const v = parse(input.value); input.value = v ? fmt(v) : ""; });
  }

  function openSpend(catId) {
    const f = findCat(catId); if (!f) return;
    const c = f.c, left = c.budget - spentOf(c.id);
    const title = `<div class="sh-title"><h3>${esc(c.name)}</h3><p>Осталось ${fmt(left)} из ${fmt(c.budget)} ${CUR}</p></div>`;
    if (readOnly) { openSheet(title); return; }
    openSheet(`${title}
      <label class="amount" for="amt"><input id="amt" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Сумма в сумах"><span>${CUR}</span></label>
      <div class="chips">${[100000, 500000].map(v => `<button type="button" data-chip="${v}">+${fmt(v)}</button>`).join("")}
        <button type="button" data-chip="all" ${left > 0 ? "" : "disabled"}>Всё</button></div>
      <button class="btn main" type="button" id="spend" disabled>Потратил</button>
      <div class="links"><button type="button" id="refund">Вернуть деньги</button><button type="button" id="editCat">Изменить</button></div>`);
    const amt = $("amt"); bindAmount(amt);
    const sync = () => { $("spend").disabled = !parse(amt.value); };
    amt.addEventListener("input", sync);
    $("sheetIn").querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
      const v = b.dataset.chip === "all" ? left : parse(amt.value) + +b.dataset.chip;
      amt.value = fmt(v); sync();
    });
    const go = sign => {
      const v = parse(amt.value); if (!v) { amt.focus(); return; }
      const op = { id: uid(), catId: c.id, amount: sign * v, ts: Date.now(), note: "", period: S.period };
      addOp(op); render(); closeSheet();
      toast(`${sign > 0 ? "−" : "+"}${fmt(v)} · ${c.name}`, op.id);
    };
    $("spend").onclick = () => go(1);
    $("refund").onclick = () => go(-1);
    amt.addEventListener("keydown", e => { if (e.key === "Enter") go(1); });
    $("editCat").onclick = () => openEdit(c.id);
    setTimeout(() => amt.focus(), 60);
  }

  function openEdit(catId, groupId) {
    const f = catId ? findCat(catId) : null;
    const c = f ? f.c : { name: "", budget: 0 };
    openSheet(`
      <div class="sh-title"><h3>${f ? "Изменить" : "Новый расход"}</h3></div>
      <label class="field" for="eName">Название<input id="eName" value="${esc(c.name)}" autocomplete="off" placeholder="Например, бензин"></label>
      <label class="field" for="eBudget">Бюджет на месяц, ${CUR}<input id="eBudget" inputmode="numeric" value="${c.budget ? fmt(c.budget) : ""}" placeholder="0" autocomplete="off"></label>
      <button class="btn main" type="button" id="eSave">Сохранить</button>
      ${f ? `<button class="btn danger" type="button" id="eDel">Удалить расход</button>` : ""}`);
    bindAmount($("eBudget"));
    $("eSave").onclick = () => {
      const name = $("eName").value.trim(); if (!name) { $("eName").focus(); return; }
      const budget = parse($("eBudget").value);
      if (f) { f.c.name = name; f.c.budget = budget; }
      else S.groups.find(g => g.id === groupId).cats.push({ id: uid(), name, budget });
      saveCfg(); render(); closeSheet();
    };
    if (f) {
      let armed = false;
      $("eDel").onclick = () => {
        if (!armed) { armed = true; $("eDel").textContent = "Точно удалить? Нажми ещё раз"; return; }
        f.g.cats = f.g.cats.filter(x => x.id !== f.c.id);
        saveCfg(); render(); closeSheet();
      };
    }
  }

  function openText(title, label, value, onSave, hint) {
    openSheet(`
      <div class="sh-title"><h3>${title}</h3></div>
      <label class="field" for="tVal">${label}<input id="tVal" value="${esc(value)}" autocomplete="off"></label>
      ${hint ? `<p class="hint">${hint}</p>` : ""}
      <button class="btn main" type="button" id="tSave">Сохранить</button>`);
    $("tSave").onclick = () => { const v = $("tVal").value.trim(); if (!v) { $("tVal").focus(); return; } onSave(v); saveCfg(); render(); closeSheet(); };
    setTimeout(() => $("tVal").focus(), 60);
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-cat],[data-addcat],[data-undo]");
    if (!t) return;
    if (t.dataset.cat) return openSpend(t.dataset.cat);
    if (t.dataset.addcat) return openEdit(null, t.dataset.addcat);
    if (t.dataset.undo) { removeOp(t.dataset.undo); render(); }
  });

  const editable = () => !readOnly && mode !== "loading" && mode !== "error";
  $("monthBtn").onclick = () => { if (editable() && S) openText("Месяц", "Название", S.month, v => S.month = v); };
  $("addGroupBtn").onclick = () => {
    if (!editable()) return;
    openText("Новая группа", "Название группы", "", v => {
      if (!S) S = { month: new Date().toLocaleDateString("ru-RU", { month: "long" }).replace(/^./, m => m.toUpperCase()), period: uid(), groups: [] };
      S.groups.push({ id: uid(), name: v, cats: [] });
    });
  };
  $("newMonthBtn").onclick = () => {
    if (!editable() || !S) return;
    openText("Новый месяц", "Название месяца", "", v => { S.month = v; S.period = uid(); },
      "Бюджеты останутся, а остатки снова станут полными.");
  };

  // Тост с отменой
  let tTimer, tOp;
  function toast(text, opId) {
    $("toastText").textContent = text; tOp = opId; $("toastUndo").hidden = !opId; $("toast").hidden = false;
    clearTimeout(tTimer); tTimer = setTimeout(() => $("toast").hidden = true, 4000);
  }
  $("toastUndo").onclick = () => { if (tOp) { removeOp(tOp); render(); } $("toast").hidden = true; };

  render();
  boot();
})();
</script>
</body>
</html>
